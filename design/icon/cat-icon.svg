<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE7C2"/><stop offset="1" stop-color="#FFC98A"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D99A5B"/><stop offset="1" stop-color="#B9773C"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7A54A"/><stop offset="1" stop-color="#EE8F2E"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7a3e00" flood-opacity="0.28"/></filter>
  </defs>
  <g filter="url(#sh)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/></g>
  <g clip-path="url(#sq)">
    <!-- cat head -->
    <g>
      <path d="M318 330 L352 170 L462 270 Z" fill="url(#fur)"/>
      <path d="M706 330 L672 170 L562 270 Z" fill="url(#fur)"/>
      <path d="M345 300 L362 215 L425 270 Z" fill="#FFB7B0"/>
      <path d="M679 300 L662 215 L599 270 Z" fill="#FFB7B0"/>
      <ellipse cx="512" cy="430" rx="238" ry="205" fill="url(#fur)"/>
      <!-- stripes -->
      <path d="M512 232 q-14 40 0 78 q14 -38 0 -78z" fill="#D9741A"/>
      <path d="M450 240 q-6 34 10 62 q6 -34 -10 -62z" fill="#D9741A"/>
      <path d="M574 240 q6 34 -10 62 q-6 -34 10 -62z" fill="#D9741A"/>
      <!-- muzzle -->
      <ellipse cx="512" cy="500" rx="105" ry="72" fill="#FFF3E3"/>
      <!-- eyes -->
      <ellipse cx="420" cy="420" rx="34" ry="42" fill="#3A2A1E"/>
      <ellipse cx="604" cy="420" rx="34" ry="42" fill="#3A2A1E"/>
      <circle cx="432" cy="404" r="12" fill="#fff"/><circle cx="616" cy="404" r="12" fill="#fff"/>
      <!-- nose + mouth -->
      <path d="M494 468 h36 q-4 22 -18 26 q-14 -4 -18 -26z" fill="#F07B82"/>
      <path d="M512 494 q-6 28 -38 24 M512 494 q6 28 38 24" stroke="#3A2A1E" stroke-width="9" fill="none" stroke-linecap="round"/>
      <!-- cheeks -->
      <ellipse cx="365" cy="490" rx="30" ry="18" fill="#FF9C8C" opacity=".55"/>
      <ellipse cx="659" cy="490" rx="30" ry="18" fill="#FF9C8C" opacity=".55"/>
      <!-- whiskers -->
      <g stroke="#7A4A22" stroke-width="7" stroke-linecap="round" opacity=".7">
        <path d="M395 500 L300 488"/><path d="M398 522 L305 532"/>
        <path d="M629 500 L724 488"/><path d="M626 522 L719 532"/>
      </g>
    </g>
    <!-- box back flap shadow -->
    <rect x="210" y="570" width="604" height="40" fill="#9C5F2C"/>
    <!-- box front -->
    <rect x="200" y="590" width="624" height="360" rx="22" fill="url(#box)"/>
    <!-- side flaps -->
    <path d="M200 600 L120 540 L150 520 L230 590 Z" fill="#C88447"/>
    <path d="M824 600 L904 540 L874 520 L794 590 Z" fill="#C88447"/>
    <!-- paws on rim -->
    <ellipse cx="410" cy="598" rx="58" ry="36" fill="url(#fur)"/>
    <ellipse cx="614" cy="598" rx="58" ry="36" fill="url(#fur)"/>
    <g stroke="#D9741A" stroke-width="7" stroke-linecap="round">
      <path d="M392 608 v14"/><path d="M428 608 v14"/><path d="M596 608 v14"/><path d="M632 608 v14"/>
    </g>
    <!-- tape -->
    <rect x="472" y="640" width="80" height="300" fill="#E9C089" opacity=".75"/>
    <!-- brief paper label -->
    <g transform="rotate(-6 512 790)">
      <rect x="392" y="720" width="240" height="150" rx="14" fill="#FFFDF8"/>
      <rect x="420" y="752" width="150" height="16" rx="8" fill="#F2A64A"/>
      <rect x="420" y="786" width="184" height="12" rx="6" fill="#D8CFC3"/>
      <rect x="420" y="812" width="164" height="12" rx="6" fill="#D8CFC3"/>
      <path d="M590 760 l12 12 l22 -26" stroke="#3FAE6A" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
